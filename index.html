<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2e9da">
  <meta name="description" content="滚动穿越流光实验室：从灵感花园进入生成中枢。">
  <title>流光实验室 · 从灵感飞入生成</title>
  <link rel="icon" href="data:,">
  <style>
    :root, .sw-root {
      --sw-bg: #f2e9da;
      --sw-ink: #20231f;
      --sw-ink-soft: #615f57;
      --sw-accent: #56a889;
      --sw-font-display: "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
      --sw-font-body: "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    }
    html { color-scheme: light; -webkit-font-smoothing: antialiased; }
    .skip-link {
      position: fixed;
      z-index: 999;
      top: 12px;
      left: 12px;
      padding: 10px 16px;
      border-radius: 10px;
      color: #fff;
      background: #20231f;
      transform: translateY(-160%);
      transition: transform 150ms ease-out;
    }
    .skip-link:focus { transform: translateY(0); }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .sw-copy__title { text-wrap: balance; }
    .sw-copy__body { text-wrap: pretty; }
    .sw-scene__still { outline: 1px solid rgba(32, 35, 31, .08); outline-offset: -1px; }
    @media (max-width: 860px) {
      .sw-topbar { padding-right: 58px; }
      .sw-brand__name { font-size: 1rem; }
      .sw-copy__tags { display: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div id="top" aria-hidden="true"></div>
  <main id="main">
    <h1 class="sr-only">流光实验室：从灵感飞入生成</h1>
    <div id="world" aria-label="两幕滚动影像：灵感花园与生成中枢"></div>
    <noscript>请启用 JavaScript，体验滚动控制的沉浸式镜头。</noscript>
  </main>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: '流光实验室', href: '#top' },
      hint: '滚动，进入世界',
      diveScroll: 1.55,
      connScroll: 1.15,
      crossfade: 0.16,
      atmosphere: true,
      nav: true,
      sections: [
        {
          id: 'inspiration',
          label: '灵感花园',
          still: 'assets/inspiration.webp',
          clip: 'assets/vid/inspiration.mp4',
          accent: '#56a889',
          eyebrow: '01 · 捕捉',
          title: '每个伟大作品，都从一束微光开始。',
          body: '把零散念头放上桌面，让它们沿着同一条溪流，汇成清晰方向。',
          tags: ['灵感采集', '概念共创', '方向对齐']
        },
        {
          id: 'generator',
          label: '生成中枢',
          still: 'assets/generator.webp',
          clip: 'assets/vid/generator.mp4',
          accent: '#d8a84e',
          eyebrow: '02 · 生成',
          title: '让想象，长成可以抵达的世界。',
          body: '创意进入生成核心，成为有节奏、有路径、可亲自穿越的数字体验。',
          tags: ['MiniMax H3', '逐帧滚动', '沉浸叙事'],
          cta: {
            primary: { label: '再飞一次', href: '#top' }
          }
        }
      ],
      connectors: ['assets/vid/conn1.mp4']
    });
  </script>
</body>
</html>
